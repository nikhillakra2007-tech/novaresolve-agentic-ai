<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="NovaResolve: Autonomous customer resolution control center for NovaCart.">
  <title>NovaResolve · Autonomous Resolution Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232563eb'/%3E%3Cpath d='M11 28V12h5l8 12V12h5v16h-5l-8-12v12z' fill='white'/%3E%3C/svg%3E">
  
  <!-- Modern Editorial Typography: Plus Jakarta Sans, JetBrains Mono, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
  
  <!-- Global Design System & Animations -->
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/animations.css">

  <!-- Modular Component Stylesheets -->
  <link rel="stylesheet" href="/components/navigation/navigation.css">
  <link rel="stylesheet" href="/components/users/users.css">
  <link rel="stylesheet" href="/components/metrics/metrics.css">
  <link rel="stylesheet" href="/components/case-panel/case-panel.css">
  <link rel="stylesheet" href="/components/verification/verification.css">
  <link rel="stylesheet" href="/components/approvals/approvals.css">
  <link rel="stylesheet" href="/components/case-queue/case-queue.css">
  <link rel="stylesheet" href="/components/command-palette/command-palette.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  
  <!-- Backdrop for Focus Spotlight Mode -->
  <div id="focus-overlay" data-action="exit-focus"></div>
  <div class="focus-banner" id="focus-banner">
    <span>🎯 Focus Mode Active</span>
    <kbd>Esc</kbd>
    <button data-action="exit-focus">Exit</button>
  </div>

  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <button class="mobile-shade" aria-label="Close navigation" data-action="close-menu"></button>
  
  <div class="app">
    <header class="topbar">
      <div class="row">
        <button class="icon-button mobile-menu" data-action="menu" aria-label="Open navigation" aria-expanded="false" id="menu-button"></button>
        <div class="breadcrumb">
          <span>Workspace</span>
          <span id="breadcrumb-chevron"></span>
          <strong id="breadcrumb-title">Overview</strong>
        </div>
      </div>
      <div class="topbar-tools">
        <label class="search">
          <span id="search-icon"></span>
          <input id="global-search" type="search" placeholder="Search cases, customers..." aria-label="Search cases and customers" autocomplete="off">
          <kbd>Ctrl K</kbd>
        </label>

        <!-- Fast Persona Switcher Pill -->
        <div class="persona-switcher-dropdown">
          <button class="persona-chip-button" data-action="toggle-persona-popover" id="persona-chip-button" title="Switch User Persona (Alex Morgan / Priya Sharma / Rahul Sharma)" aria-label="Switch User Persona">
            <span class="avatar-sm" id="chip-avatar">AM</span>
            <span class="chip-name" id="chip-name">Alex Morgan</span>
            <span class="chip-badge" id="chip-badge">Manager</span>
            <span id="chip-chevron"></span>
          </button>
        </div>
        
        <!-- Quick Autonomous Threshold HUD Button -->
        <button class="threshold-hud-chip" data-action="profile" title="Click to adjust Autonomous Policy Governance Threshold" aria-label="Autonomous Policy Governance Threshold">
          <span>Auto Threshold:</span>
          <strong id="hud-threshold">$100.00</strong>
        </button>

        <!-- Futuristic Audio Toggle -->
        <button class="icon-button sound-toggle-btn active" data-action="toggle-sound" id="sound-button" title="Toggle Futuristic Audio Feedback (Sound FX)" aria-label="Toggle Futuristic Audio Feedback"></button>

        <!-- Focus Mode Toggle -->
        <button class="icon-button" data-action="toggle-focus" id="focus-button" title="Spotlight Focus Mode (Key: F)" aria-label="Toggle Focus Mode"></button>
        
        <!-- Light / Dark Theme Toggle -->
        <button class="icon-button" data-action="toggle-theme" id="theme-button" title="Toggle Light / Dark Mode" aria-label="Toggle Light and Dark Mode"></button>

        <!-- GitHub Repository Link -->
        <a href="https://github.com/nikhillakra2007-tech/novaresolve-agentic-ai" target="_blank" rel="noopener noreferrer" class="icon-button" title="View on GitHub" aria-label="GitHub Repository" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: inherit;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width: 17px; height: 17px;"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
        </a>

        <div class="separator"></div>
        <button class="icon-button notification" data-action="notifications" id="notification-button" aria-label="Notifications" aria-expanded="false"></button>
        
        <!-- User Profile Avatar Button -->
        <button class="avatar-button" data-action="profile" title="Open User Profile & Settings" aria-label="User profile and preferences">
          <span class="avatar" id="topbar-avatar" aria-label="Current User">AM</span>
        </button>
      </div>
    </header>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div id="popover-root"></div>
  <div id="cmd-root"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>

  <!-- Modular Component Application Core -->
  <script type="module" src="/app.js"></script>
</body>
</html>
