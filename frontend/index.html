          <p>Try searching by customer name, email, or case reference.</p>
          <button class="button small" data-action="clear-filters">Clear search</button>
        </div>
      `}
    `;
  }

  function activityItem(event) {
    return `
      <article class="activity-row">
        ${icon(event.icon || 'activity')}
        <div>
          <strong>${esc(event.title)}</strong>
          <p>${esc(event.detail)}</p>
          <button class="text-button" data-action="select" data-id="${event.id}">${event.id} ${icon('arrow')}</button>
        </div>
        <time datetime="${new Date(event.time).toISOString()}">${ago(event.time)}</time>
      </article>
    `;
  }

  function activityView() {
    const events = [
      ...audit,
      ...cases.map(c => ({
        id: c.id,
        title: `${c.customer} · ${c.status}`,
        detail: c.reason,
        time: c.updated,
        icon: (statuses[c.status] || [])[1] || 'activity'
      }))
    ].sort((a, b) => b.time - a.time).filter(e => !state.query || [e.id, e.title, e.detail].some(v => v.toLowerCase().includes(state.query.toLowerCase())));

    return `
      ${mainHeading('Resolution activity', 'An accountable record of decisions, actions, and verified outcomes.')}
      <div class="section-label">
        <h2>Workspace activity</h2>
        <span class="right-label">${icon('clock')} Current demo session</span>
      </div>
      <div class="panel">
        ${events.length ? events.map(activityItem).join('') : '<div class="empty"><h3>No matching activity</h3><p>Try a different search to find a decision or case.</p><button class="button small" data-action="clear-filters">Clear search</button></div>'}
      </div>
    `;
  }

  function render() {
    const focus = document.activeElement;
    const focusId = focus?.id;
    const action = focus?.dataset?.action;
    const tab = focus?.dataset?.tab;

    renderSidebar();
    document.getElementById('breadcrumb-title').textContent = pageNames[state.view] || 'Overview';
    document.title = `NovaResolve · ${pageNames[state.view] || 'Overview'}`;

    const pageChanged = previousView !== state.view;
    const tabChanged = previousTab !== state.tab;

    const main = document.getElementById('main');
    main.classList.remove('page-enter');
    const views = { overview, cases: casesView, approvals: approvalsView, customers: customersView, activity: activityView };
    main.innerHTML = (views[state.view] || overview)() + `
      <footer class="footer">
        <span class="row">${icon('shield')} NovaResolve · Autonomous customer resolution</span>
        <span>Demo workspace · Simulated data</span>
      </footer>
    `;

    if (pageChanged) {
      void main.offsetWidth;
      main.classList.add('page-enter');
    } else if (tabChanged) {
      document.getElementById('case-tab-panel')?.classList.add('tab-enter');
    }

    previousView = state.view;
    previousTab = state.tab;
    previousStage = selected().status;

    if (focusId && focusId !== 'global-search') document.getElementById(focusId)?.focus({ preventScroll: true });
    else if (action === 'tab') document.querySelector(`[data-tab="${tab}"]`)?.focus({ preventScroll: true });
  }

  function navigate(view, { preserve = false } = {}) {
    if (!pageNames[view]) view = 'overview';
    if (!preserve) {
      state.query = '';
      document.getElementById('global-search').value = '';
      state.filter = 'all';
      state.risk = 'all';
    }
    state.view = view;
    closePopover();
    closeMenu();
    if (location.hash !== `#${view}`) history.pushState(null, '', `#${view}`);
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function selectCase(id) {
    if (!caseById(id)) return;
    state.selected = id;
    state.tab = 'trace';
    state.expanded.clear();
    navigate('overview');
    document.querySelector('.case-title')?.setAttribute('tabindex', '-1');
    document.querySelector('.case-title')?.focus({ preventScroll: true });
    
    // Trigger cinematic spotlight burst on the selected case panel
    triggerSpotlightBurst(document.getElementById('case-panel'));
  }

  // Cinematic Spotlight Pop-Out Function (3.2 seconds burst)
  function triggerSpotlightBurst(el) {
    if (!el) return;
    clearTimeout(burstTimer);
    el.classList.remove('spotlight-burst');
    void el.offsetWidth;
    el.classList.add('spotlight-burst');
    burstTimer = setTimeout(() => {
      el.classList.remove('spotlight-burst');
    }, 3200);
  }

  function toggleFocusMode() {
    focusMode = !focusMode;
    document.body.classList.toggle('focus-mode-active', focusMode);
    const btn = document.getElementById('focus-button');
    if (btn) btn.classList.toggle('active', focusMode);
    render();
    if (focusMode) {
      setTimeout(() => {
        const target = document.querySelector('.spotlight-focus-target') || document.getElementById('case-panel');
        if (target) {
          const topbar = document.querySelector('.topbar');
          const offset = (topbar ? topbar.offsetHeight : 64) + 16;
          const targetTop = target.getBoundingClientRect().top + window.pageYOffset - offset;
          window.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
        }
      }, 50);
    }
    toast(focusMode ? 'Spotlight Focus Mode activated. Press Esc to exit.' : 'Focus Mode deactivated.');
  }

  function switchPersona(personaKey) {
    if (!personas[personaKey]) return;
    activePersona = personaKey;
    const p = personas[activePersona];
    if (p.defaultCase && caseById(p.defaultCase)) {
      state.selected = p.defaultCase;
    }
    const dlg = document.getElementById('dialog');
    if (dlg && dlg.open) dlg.close();
    closePopover();
    render();
    toast(`Active persona switched to ${p.name} (${p.role}).`);
  }

  function personaPopover() {
    if (state.popover === 'persona') { closePopover(); return; }
    state.popover = 'persona';
    const root = document.getElementById('popover-root');
    root.innerHTML = `
      <div class="popover persona-popover" role="dialog" aria-label="Switch User Persona">
        <div class="popover-title">
          <span>Switch User Persona</span>
        </div>
        <div class="persona-menu-list">
          ${Object.entries(personas).map(([key, p]) => `
            <button class="persona-menu-item ${activePersona === key ? 'active' : ''}" data-action="select-persona-quick" data-persona="${key}">
              <span class="avatar ${p.tone}">${p.initials}</span>
              <div class="persona-menu-info">
                <strong>${esc(p.name)}</strong>
                <small>${esc(p.role)} · ${esc(p.department)}</small>
              </div>
              ${activePersona === key ? icon('circleCheck', 'check-icon') : ''}
            </button>
          `).join('')}
        </div>
        <div class="popover-footer">
          <button class="text-button" data-action="profile">${icon('sliders')} Governance & Preferences</button>
        </div>
      </div>
    `;
  }

  function toggleTheme(forced) {
    currentTheme = forced || (currentTheme === 'dark' ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', currentTheme);
    localStorage.setItem('novaresolve-theme', currentTheme);
    const themeBtn = document.getElementById('theme-button');
    if (themeBtn) themeBtn.innerHTML = icon(currentTheme === 'dark' ? 'sun' : 'moon');
    toast(`Switched to ${currentTheme === 'dark' ? 'Dark' : 'Light'} theme.`);
  }

  function toast(message) {
    clearTimeout(toastTimer);
    const el = document.getElementById('toast');
    el.innerHTML = icon('circleCheck') + `<span>${esc(message)}</span>`;
    el.hidden = false;
    toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
  }

  function closeMenu() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('menu-button')?.setAttribute('aria-expanded', 'false');
  }

  function closePopover() {
    state.popover = null;
    document.getElementById('popover-root').innerHTML = '';
    document.getElementById('notification-button')?.setAttribute('aria-expanded', 'false');
  }

  function notifications() {
    if (state.popover === 'notifications') { closePopover(); return; }
    state.popover = 'notifications';
    document.getElementById('notification-button')?.setAttribute('aria-expanded', 'true');
    document.getElementById('popover-root').innerHTML = `
      <section class="popover" aria-label="Notifications">
        <div class="popover-title">Needs your attention <span class="badge amber" style="margin-left:8px">${pending().length}</span></div>
        ${pending().length ? pending().map(c => `
          <button class="popover-item" data-action="review" data-id="${c.id}" data-decision="approve">
            ${icon('shield')}
            <span>
              <strong>${esc(c.customer)} · ${money(c.amount)} refund</strong>
              <small>${c.id} · Approval required</small>
            </span>
          </button>
        `).join('') : '<div class="popover-content"><p>You’re all caught up. No approvals need attention.</p></div>'}
      </section>
    `;
  }

  function openDialog(title, body, actions) {
    lastDialogFocus = document.activeElement;
    closePopover();
    const d = document.getElementById('dialog');
    d.innerHTML = `
      <div class="dialog-header">
        <h2 id="dialog-title">${title}</h2>
        <button class="icon-button" data-action="close-dialog" aria-label="Close dialog">${icon('x')}</button>
      </div>
      <div class="dialog-body">${body}</div>
      <div class="dialog-actions">${actions || '<button class="button" data-action="close-dialog">Done</button>'}</div>
    `;
    d.showModal();
  }

  function review(id, decision) {
    const c = caseById(id);
    if (!c || c.status !== 'Awaiting Approval') {
      toast('This case no longer requires approval.');
      return;
    }
    openDialog(
      decision === 'approve' ? 'Review refund approval' : 'Reject refund request',
      `
        <span class="badge amber">${icon('shield')} Human decision required</span>
        <p>${esc(c.recommendation)}</p>
        <dl class="facts">
          <div><dt>Customer</dt><dd>${esc(c.customer)} · ${c.id}</dd></div>
          <div><dt>Order</dt><dd>#${c.order} · ${esc(c.product)}</dd></div>
          <div><dt>Refund amount</dt><dd><strong>${money(c.amount)}</strong></dd></div>
          <div><dt>Risk reason</dt><dd>${esc(c.reason)}</dd></div>
        </dl>
        <label for="decision-note">${decision === 'reject' ? 'Reason for rejection (required)' : 'Decision note (optional)'}</label>
        <textarea id="decision-note" placeholder="${decision === 'reject' ? 'Explain what needs further review...' : 'Add context for the decision record...'}" maxlength="500" ${decision === 'reject' ? 'required' : ''}></textarea>
        <p class="demo-disclosure">Demo action recorded by <strong>${personas[activePersona].name}</strong> (${personas[activePersona].role}). No real payment is made.</p>
      `,
      `
        <button class="button" data-action="close-dialog">Cancel</button>
        <button class="button ${decision === 'approve' ? 'primary' : 'danger'}" data-action="confirm-decision" data-id="${id}" data-decision="${decision}">
          ${icon(decision === 'approve' ? 'check' : 'x')}
          ${decision === 'approve' ? 'Confirm approval' : 'Confirm rejection'}
        </button>
      `
    );
  }

  function decision(id, value) {
    const c = caseById(id);
    if (!c || c.status !== 'Awaiting Approval') return;
    const note = document.getElementById('decision-note');
    if (value === 'reject' && !note.value.trim()) {
      note.setCustomValidity('Please add a reason for rejection.');
      note.reportValidity();
      return;
    }
    note.setCustomValidity('');
    c.decision = value;
    c.decisionNote = note.value.trim();
    c.updated = Date.now();
    c.status = value === 'approve' ? 'Executing' : 'Escalated';
    c.reason = value === 'approve' ? `Human approval received from ${personas[activePersona].name}. The agent is submitting the refund.` : `Refund rejected by ${personas[activePersona].name}. ${c.decisionNote}`;
    audit.unshift({
      id: c.id,
      title: `Refund ${value === 'approve' ? 'approved' : 'rejected'} by ${personas[activePersona].name}`,
      detail: `${money(c.amount)} · ${c.customer}${c.decisionNote ? ' · ' + c.decisionNote : ''}`,
      time: Date.now(),
      icon: value === 'approve' ? 'check' : 'x'
    });
    document.getElementById('dialog').close();
    render();
    toast(value === 'approve' ? 'Demo approval recorded. The agent will execute and verify.' : 'Demo rejection recorded. Case escalated for specialist review.');

    // Trigger spotlight pop-out on the overview case card
    triggerSpotlightBurst(document.getElementById('case-panel'));

    if (value === 'approve') {
      const first = setTimeout(() => {
        c.status = 'Verifying';
        c.reason = 'Refund submitted. Confirming the payment record matches the approved amount.';
        c.updated = Date.now();
        render();
        const second = setTimeout(() => {
          c.status = 'Resolved';
          c.verified = true;
          c.reason = 'Refund completed and verified against the payment record.';
          c.updated = Date.now();
          audit.unshift({
            id: c.id,
            title: 'Refund outcome verified',
            detail: `${money(c.amount)} refund confirmed. Case resolved.`,
            time: Date.now(),
            icon: 'shield'
          });
          approvalTimers.delete(c.id);
          render();
          toast(`${c.id}: simulated refund verified. Case resolved.`);
        }, 2400);
        approvalTimers.set(c.id, second);
      }, 2000);
      approvalTimers.set(c.id, first);
    }
  }

  function runReplay() {
    if (state.playing) {
      clearTimeout(replayTimer);
      state.playing = false;
      render();
      toast('Demo replay paused. Inspect any completed step.');
      return;
    }
    state.playing = true;
    state.selected = 'NR-1024';
    state.tab = 'trace';
    state.expanded.clear();
    const c = caseById('NR-1024');
    c.stage = 0;
    c.verified = false;
    c.updated = Date.now();
    applyStage(c);
    navigate('overview');
    toast('Replaying the demo workflow from investigation to verification.');
    triggerSpotlightBurst(document.getElementById('case-panel'));

    function advance() {
      if (!state.playing) return;
      c.stage++;
      c.updated = Date.now();
      applyStage(c);
      if (c.stage >= 9) {
        state.playing = false;
        audit.unshift({
          id: c.id,
          title: 'Replacement outcome verified',
          detail: 'Delhi constraint resolved through Jaipur inventory. One unit reserved and verified.',
          time: Date.now(),
          icon: 'shield'
        });
        render();
        toast('Goal achieved. Replacement routed to Jaipur and verified.');
        triggerSpotlightBurst(document.getElementById('case-panel'));
        return;
      }
      render();
      replayTimer = setTimeout(advance, c.stage === 5 ? 3000 : 1400);
    }
    replayTimer = setTimeout(advance, 1200);
  }

  function applyStage(c) {
    const stageStates = ['Investigating', 'Investigating', 'Planning', 'Executing', 'Replanning', 'Replanning', 'Replanning', 'Executing', 'Verifying', 'Resolved'];
    c.status = stageStates[c.stage];
    c.verified = c.stage === 9;
    c.reason = [
      'Matching the customer to their account.',
      'Inspecting the order and delivery record.',
      'Checking replacement eligibility and risk.',
      'Checking available inventory at the original warehouse.',
      'Delhi warehouse has no inventory. The original route cannot fulfill this request.',
      'Original fulfillment warehouse has no available inventory.',
      'Jaipur has 4 units available. Updating the replacement plan.',
      'Reserving 1 unit and creating the replacement at Jaipur.',
      'Checking replacement RP-2084 and the reserved inventory quantity.',
      'Replacement RP-2084 created at Jaipur. One unit reserved and independently verified.'
    ][c.stage];
  }

  function refreshQueue() {
    if (state.loading) return;
    state.loading = true;
    state.error = false;
    render();
    loadTimer = setTimeout(() => {
      state.loading = false;
      render();
      toast('Demo queue refreshed. All session changes retained.');
    }, 600);
  }

  function systemDialog() {
    openDialog(
      'System status',
      `
        <span class="badge green">${icon('check')} Frontend engine active</span>
        <p>This workspace demonstrates the NovaResolve autonomous customer resolution experience using live fixtures.</p>
        <dl class="facts">
          <div><dt>Runtime</dt><dd>Node.js Native Server (:3000)</dd></div>
          <div><dt>Active Persona</dt><dd>${personas[activePersona].name} (${personas[activePersona].role})</dd></div>
          <div><dt>Autonomous Cap</dt><dd>${money(autonomousThreshold)}</dd></div>
          <div><dt>Agent Rerouting</dt><dd>${autoRerouteEnabled ? 'Enabled (Jaipur fallback)' : 'Disabled'}</dd></div>
          <div><dt>Backend</dt><dd>FastAPI Engine (:8000 ready)</dd></div>
        </dl>
      `,
      '<button class="button primary" data-action="close-dialog">Done</button>'
    );
  }

  // Comprehensive User Profile & Governance Preferences Modal
  function preferences() {
    const p = personas[activePersona];
    const casesOverThreshold = cases.filter(c => c.amount > autonomousThreshold).length;

    openDialog(
      'Operator Profile & Governance Settings',
      `
        <div class="row" style="margin-bottom: 16px;">
          ${avatar(p.name, p.tone)}
          <div>
            <h3 style="font-size: 16px;">${esc(p.name)}</h3>
            <p style="font-size: 12.5px;">${esc(p.role)} · <strong>${esc(p.level)}</strong></p>
            <p style="font-size: 11.5px; color: var(--muted);">${esc(p.email)}</p>
          </div>
        </div>

        <label style="margin-top: 10px;">Switch User Persona / View Mode</label>
        <div class="persona-selector">
          <div class="persona-card ${activePersona === 'manager' ? 'active' : ''}" data-action="set-persona" data-persona="manager">
            ${avatar('Alex Morgan')}
            <strong>Alex Morgan</strong>
            <small>Resolution Lead</small>
          </div>
          <div class="persona-card ${activePersona === 'specialist' ? 'active' : ''}" data-action="set-persona" data-persona="specialist">
            ${avatar('Priya Sharma', 'mauve')}
            <strong>Priya Sharma</strong>
            <small>Dispute Specialist</small>
          </div>
          <div class="persona-card ${activePersona === 'customer' ? 'active' : ''}" data-action="set-persona" data-persona="customer">
            ${avatar('Rahul Sharma', 'sand')}
            <strong>Rahul Sharma</strong>
            <small>Customer View</small>
          </div>
        </div>

        <div class="slider-container">
          <div class="slider-header">
            <div>
              <label style="margin: 0; font-size: 13px;">Autonomous Approval Ceiling</label>
              <small style="color: var(--muted); display: block;">Amounts exceeding this value require manual manager sign-off.</small>
            </div>
            <strong id="threshold-val">${money(autonomousThreshold)}</strong>
          </div>
          <input type="range" class="range-slider" id="threshold-range" min="2000" max="25000" step="500" value="${autonomousThreshold}">
          <div class="range-meta">
            <span>₹2,000 (Conservative)</span>
            <span id="threshold-impact-badge" style="font-weight: 600; color: var(--accent);">${casesOverThreshold} cases require oversight</span>
            <span>₹25,000 (Aggressive)</span>
          </div>
        </div>

        <label>Operational Governance Policies</label>
        <div class="toggle-row">
          <div class="toggle-label">
            <strong>Autonomous Inventory Rerouting</strong>
            <small>Automatically search secondary warehouses when primary stock is zero</small>
          </div>
          <label class="switch">
            <input type="checkbox" id="reroute-toggle" ${autoRerouteEnabled ? 'checked' : ''}>
            <span class="switch-slider"></span>
          </label>
        </div>

        <div class="toggle-row">
          <div class="toggle-label">
            <strong>Spotlight Focus Mode</strong>
            <small>Dim canvas background when inspecting decisions or replans (Shortcut: F)</small>
          </div>
          <label class="switch">
            <input type="checkbox" id="focus-toggle" ${focusMode ? 'checked' : ''}>
            <span class="switch-slider"></span>
          </label>
        </div>

        <label style="margin-top: 16px;">Interface Appearance</label>
        <div class="theme-selector-grid">
          <button class="theme-btn ${currentTheme === 'light' ? 'active' : ''}" data-action="set-theme-mode" data-theme="light">
            ${icon('sun')} Light
          </button>
          <button class="theme-btn ${currentTheme === 'dark' ? 'active' : ''}" data-action="set-theme-mode" data-theme="dark">
            ${icon('moon')} Dark
          </button>
          <button class="theme-btn" data-action="toggle-theme">
            ${icon('refresh')} Toggle
          </button>
        </div>
      `,
      `
        <button class="button" data-action="close-dialog">Cancel</button>
        <button class="button primary" data-action="save-preferences">Apply & Save</button>
      `
    );

    // Bind real-time range slider update
    const slider = document.getElementById('threshold-range');
    const valDisplay = document.getElementById('threshold-val');
    const impactBadge = document.getElementById('threshold-impact-badge');
    if (slider && valDisplay) {
      slider.addEventListener('input', e => {
        const val = Number(e.target.value);
        valDisplay.textContent = money(val);
        const over = cases.filter(c => c.amount > val).length;
        if (impactBadge) {
          impactBadge.textContent = `${over} case${over === 1 ? '' : 's'} require oversight`;
        }
      });
    }
  }

  function applyThresholdUpdate(newThreshold) {
    autonomousThreshold = newThreshold;
    // Re-evaluate pending status based on new threshold
    cases.forEach(c => {
      if (c.status === 'Awaiting Approval' && c.amount <= autonomousThreshold && !c.decision) {
        c.status = 'Executing';
        c.reason = `Qualifies for autonomous execution under updated threshold (${money(autonomousThreshold)}).`;
      } else if (c.status === 'Executing' && c.amount > autonomousThreshold && !c.verified) {
        c.status = 'Awaiting Approval';
        c.reason = `Refund amount exceeds the ${money(autonomousThreshold)} autonomous approval threshold.`;
      }
    });
    render();
    toast(`Autonomous approval threshold set to ${money(autonomousThreshold)}.`);
  }

  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) {
      const nav = event.target.closest('a[href^="#"]');
      if (nav && pageNames[nav.hash.slice(1)]) {
        event.preventDefault();
        navigate(nav.hash.slice(1));
        return;
      }
      const row = event.target.closest('[data-case]');
      if (row) {
        selectCase(row.dataset.case);
        return;
      }
      if (!event.target.closest('.popover')) closePopover();
      return;
    }

    const a = button.dataset.action;
    if (a === 'navigate') navigate(button.dataset.view);
    else if (a === 'menu') {
      const open = document.getElementById('sidebar').classList.toggle('open');
      button.setAttribute('aria-expanded', String(open));
      if (open) document.querySelector('.nav a')?.focus();
    }
    else if (a === 'close-menu') { closeMenu(); document.getElementById('menu-button')?.focus(); }
    else if (a === 'notifications') notifications();
    else if (a === 'system') systemDialog();
    else if (a === 'profile') preferences();
    else if (a === 'toggle-theme') toggleTheme();
    else if (a === 'toggle-focus') toggleFocusMode();
    else if (a === 'exit-focus') { if (focusMode) toggleFocusMode(); }
    else if (a === 'set-theme-mode') { toggleTheme(button.dataset.theme); preferences(); }
    else if (a === 'toggle-persona-popover') personaPopover();
    else if (a === 'select-persona-quick') switchPersona(button.dataset.persona);
    else if (a === 'set-persona') switchPersona(button.dataset.persona);
    else if (a === 'save-preferences') {
      const slider = document.getElementById('threshold-range');
      if (slider) {
        applyThresholdUpdate(Number(slider.value));
      }
      const rerouteCheckbox = document.getElementById('reroute-toggle');
      if (rerouteCheckbox) {
        autoRerouteEnabled = rerouteCheckbox.checked;
      }
      const focusCheckbox = document.getElementById('focus-toggle');
      if (focusCheckbox && focusCheckbox.checked !== focusMode) {
        toggleFocusMode();
      }
      document.getElementById('dialog').close();
      render();
    }
    else if (a === 'metric') {
      state.filter = button.dataset.filter;
      state.risk = 'all';
      state.query = '';
      document.getElementById('global-search').value = '';
      navigate('cases', { preserve: true });
    }
    else if (a === 'select') selectCase(button.dataset.id);
    else if (a === 'tab') { state.tab = button.dataset.tab; render(); }
    else if (a === 'step') {
      const key = `${selected().id}-${button.dataset.step}`;
      state.expanded.has(key) ? state.expanded.delete(key) : state.expanded.add(key);
      render();
      document.querySelector(`[data-action="step"][data-step="${button.dataset.step}"]`)?.focus({ preventScroll: true });
    }
    else if (a === 'expand-all') {
      if (state.expanded.size) state.expanded.clear();
      else caseSteps(selected()).forEach((s, i) => { if (s.state !== 'waiting') state.expanded.add(`${selected().id}-${i}`); });
      render();
    }
    else if (a === 'review') review(button.dataset.id, button.dataset.decision);
    else if (a === 'confirm-decision') decision(button.dataset.id, button.dataset.decision);
    else if (a === 'close-dialog') document.getElementById('dialog').close();
    else if (a === 'replay') runReplay();
    else if (a === 'clear-filters') {
      state.query = '';
      state.filter = 'all';
      state.risk = 'all';
      document.getElementById('global-search').value = '';
      render();
    }
    else if (a === 'refresh' || a === 'retry') refreshQueue();
    else if (a === 'case-info') {
      const c = selected();
      openDialog(
        `${c.id} · Case information`,
        `
          ${badge(c.status)}
          <p style="margin: 10px 0">${esc(c.goal)}</p>
          <dl class="facts">
            <div><dt>Customer</dt><dd>${esc(c.customer)}</dd></div>
            <div><dt>Email</dt><dd>${esc(c.email)}</dd></div>
            <div><dt>Order</dt><dd>#${c.order}</dd></div>
            <div><dt>Product</dt><dd>${esc(c.product)}</dd></div>
            <div><dt>Amount</dt><dd>${money(c.amount)}</dd></div>
            <div><dt>Next action</dt><dd>${esc(c.recommendation)}</dd></div>
          </dl>
          <p class="demo-disclosure">Simulated fixture data for NovaResolve operations.</p>
        `
      );
    }
  });

  document.addEventListener('change', event => {
    if (event.target.id === 'status-filter') { state.filter = event.target.value; render(); }
    else if (event.target.id === 'risk-filter') { state.risk = event.target.value; render(); }
  });

  document.getElementById('global-search').addEventListener('input', event => {
    state.query = event.target.value;
    if (state.view === 'overview' || state.view === 'approvals') {
      state.view = 'cases';
      history.replaceState(null, '', '#cases');
    }
    render();
  });

  document.addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k' && !document.getElementById('dialog').open) {
      event.preventDefault();
      document.getElementById('global-search').focus();
    }
    if (event.key.toLowerCase() === 'f' && !['input', 'textarea', 'select'].includes(document.activeElement?.tagName?.toLowerCase()) && !document.getElementById('dialog').open) {
      event.preventDefault();
      toggleFocusMode();
    }
    if (event.key === 'Escape') {
      if (focusMode) { toggleFocusMode(); }
      if (state.popover) { closePopover(); document.getElementById('notification-button')?.focus(); }
      if (document.getElementById('sidebar').classList.contains('open')) { closeMenu(); document.getElementById('menu-button')?.focus(); }
    }
    if (event.target.matches('[role="tab"]') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
      event.preventDefault();
      const tabs = ['trace', 'evidence', 'verification'];
      const index = tabs.indexOf(state.tab);
      state.tab = event.key === 'Home' ? tabs[0] : event.key === 'End' ? tabs[2] : tabs[(index + (event.key === 'ArrowRight' ? 1 : 2)) % 3];
      render();
      document.getElementById(`tab-${state.tab}`)?.focus();
    }
  });

  document.getElementById('dialog').addEventListener('close', () => {
    if (lastDialogFocus?.isConnected) lastDialogFocus.focus();
    else document.getElementById('main').focus({ preventScroll: true });
  });

  document.getElementById('dialog').addEventListener('click', event => {
    const d = event.currentTarget, r = d.getBoundingClientRect();
    if (event.target === d && (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom)) d.close();
  });

  window.addEventListener('popstate', () => {
    state.view = pageNames[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
    state.query = '';
    document.getElementById('global-search').value = '';
    render();
  });

  document.getElementById('menu-button').innerHTML = icon('menu');
  document.getElementById('breadcrumb-chevron').innerHTML = icon('right');
  document.getElementById('search-icon').innerHTML = icon('search');

  state.view = pageNames[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
  render();
  </script>
</body>
</html>
